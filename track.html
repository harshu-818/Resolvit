<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track a Complaint | ResolveIt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo">ResolveIt</a>
      <nav class="menu">
        <a href="index.html">Home</a>
        <a href="process.html">Process</a>
        <a href="login.html">Login</a>
        <a href="submit.html">Submit</a>
        <a href="track.html" class="here">Track</a>
        <a href="recent.html">Recent</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="step-label">Page 5 of 7</p>
    <h1>Track a complaint</h1>
    <p class="intro">Enter your tracking ID to see its progress.</p>

    <form id="trackForm" action="#" autocomplete="off">
      <label for="trackId">Tracking ID</label>
      <input type="text" id="trackId" placeholder="e.g. CMP-0481">
      <button type="submit">Track</button>
    </form>
    <p class="error" id="msg" role="alert"></p>

    <p>Demo IDs:
      <button type="button" class="small secondary" data-id="CMP-0481">0481</button>
      <button type="button" class="small secondary" data-id="CMP-0480">0480</button>
      <button type="button" class="small secondary" data-id="CMP-0478">0478</button>
      <button type="button" class="small secondary" data-id="CMP-0479">0479 (resolved)</button>
    </p>

    <div id="result" aria-live="polite"></div>

    <div class="pager">
      <a href="submit.html"> Previous: Submit</a>
      <a href="recent.html">Next: Recent </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap"> 2026 ResolveIt. Demo project.</div>
  </footer>

  
</body>
</html>
